<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ | 株式会社テスト製作所</title>
<script src="/probe.js"></script></head><body>
<h1>お問い合わせフォーム</h1>
<form action="/submit-b" method="post">
<table>
<tr><th>会社名<span class="hissu">必須</span></th><td><input type="text" name="corp" required></td></tr>
<tr><th>お名前<span class="hissu">必須</span></th><td>姓 <input type="text" name="last_name" placeholder="山田" required> 名 <input type="text" name="first_name" placeholder="太郎" required></td></tr>
<tr><th>メールアドレス<span class="hissu">必須</span></th><td><input type="text" name="mail" required></td></tr>
<tr><th>メールアドレス（確認用）<span class="hissu">必須</span></th><td><input type="text" name="mail_confirm" required></td></tr>
<tr><th>電話番号<span class="hissu">必須</span></th><td><input type="text" name="tel1" size="4" maxlength="5"> - <input type="text" name="tel2" size="4" maxlength="4"> - <input type="text" name="tel3" size="4" maxlength="4"><br><span class="note">半角数字</span></td></tr>
<tr><th>役職<span class="nin">任意</span></th><td><input type="text" name="position"></td></tr>
<tr><th>件名<span class="hissu">必須</span></th><td><input type="text" name="title" required></td></tr>
<tr><th>お問い合わせ内容<span class="hissu">必須</span></th><td><textarea name="body" required></textarea></td></tr>
</table>
<div class="g-recaptcha" data-sitekey="dummy"></div>
<button type="submit">確認画面へ</button>
</form></body></html>
