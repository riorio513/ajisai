<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ</title>
<script src="/probe.js"></script></head><body>
<h1>お問い合わせフォーム</h1>
<form action="/submit-c" method="post">
  <dl>
    <dt>貴社名 <em>(必須)</em></dt><dd><input type="text" name="company_name" required></dd>
    <dt>担当者名 <em>(必須)</em></dt><dd><input type="text" name="your_name" required></dd>
    <dt>フリガナ <em>(必須)</em></dt><dd><input type="text" name="your_kana" placeholder="ヤマダ タロウ" required><br>全角カタカナで入力してください</dd>
    <dt>郵便番号 <em>(必須)</em></dt><dd>〒<input type="text" name="zip1" maxlength="3" size="3" required> - <input type="text" name="zip2" maxlength="4" size="4" required></dd>
    <dt>都道府県 <em>(必須)</em></dt><dd><select name="pref" required><option value="">選択してください</option><option value="13">東京都</option><option value="14">神奈川県</option><option value="27">大阪府</option></select></dd>
    <dt>住所 <em>(必須)</em></dt><dd><input type="text" name="address" required placeholder="新宿区西新宿1-2-3"></dd>
    <dt>電話番号 <em>(必須)</em></dt><dd><input type="tel" name="phone" required placeholder="03-1234-5678"></dd>
    <dt>メールアドレス <em>(必須)</em></dt><dd><input type="email" name="email" required></dd>
    <dt>ご用件 <em>(必須)</em></dt><dd><textarea name="content" required></textarea></dd>
  </dl>
  <button type="submit">送信</button>
</form></body></html>
