<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ</title>
<script src="/probe.js"></script></head><body>
<h1>お問い合わせフォーム</h1>
<form action="/submit-f" method="post">
  <p><label>会社名 <b>*</b><br><input type="text" name="company"></label></p>
  <p><label>お名前 <b>*</b><br><input type="text" name="fullname"></label></p>
  <p><label>メールアドレス <b>*</b><br><input type="email" name="email"></label></p>
  <fieldset><legend>お問い合わせ種別 <b>*</b></legend>
    <label><input type="radio" name="kind" value="service"> サービスについて</label>
    <label><input type="radio" name="kind" value="recruit"> 採用について</label>
    <label><input type="radio" name="kind" value="other"> その他</label>
  </fieldset>
  <p><label>都道府県<br><select name="pref"><option value="">--</option><option>東京都</option><option>大阪府</option></select></label></p>
  <fieldset><legend>ご興味のあるサービス（任意）</legend>
    <label><input type="checkbox" name="svc[]" value="a"> 採用支援</label>
    <label><input type="checkbox" name="svc[]" value="b"> 広報支援</label>
  </fieldset>
  <p><label>お問い合わせ内容 <b>*</b><br><textarea name="message"></textarea></label></p>
  <p><label><input type="checkbox" name="agree" value="1" required> <a href="/privacy.html">個人情報の取り扱い</a>に同意する</label></p>
  <p><label>添付ファイル<input type="file" name="attachment"></label></p>
  <button type="submit">送信</button>
</form></body></html>
