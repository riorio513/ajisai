<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせフォーム | サンプル運輸</title>
<script src="/probe.js"></script></head><body>
<h1>お問い合わせ</h1>
<p>以下のフォームよりお問い合わせください。※は必須項目です。</p>
<form action="/submit-a" method="post" id="contact-a">
  <div class="row"><label for="company">会社名 <span class="req">※必須</span></label><input type="text" id="company" name="company" required></div>
  <div class="row"><label for="dept">部署名</label><input type="text" id="dept" name="department"></div>
  <div class="row"><label for="fullname">お名前 <span class="req">必須</span></label><input type="text" id="fullname" name="name" placeholder="山田 太郎" required></div>
  <div class="row"><label for="email">メールアドレス <span class="req">必須</span></label><input type="email" id="email" name="email" required></div>
  <div class="row"><label for="tel">電話番号 <span class="req">必須</span></label><input type="tel" id="tel" name="tel" placeholder="09012345678" required><small>半角数字・ハイフンなしで入力してください</small></div>
  <div class="row"><label for="subject">件名</label><input type="text" id="subject" name="subject" maxlength="100"></div>
  <div class="row"><label for="message">お問い合わせ内容 <span class="req">必須</span></label><textarea id="message" name="message" rows="8" maxlength="1000" required></textarea><small>1000文字以内でご入力ください</small></div>
  <input type="hidden" name="csrf_token" value="abc123">
  <input type="text" name="website_url" style="display:none" tabindex="-1" value="">
  <input type="text" name="hp_trap" style="position:absolute;left:-9999px" tabindex="-1" aria-hidden="true">
  <button type="submit">送信する</button>
</form></body></html>
