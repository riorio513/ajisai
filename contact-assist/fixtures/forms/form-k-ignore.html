<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>お問い合わせ</title>
<script src="/probe.js"></script></head><body>
<h1>お問い合わせフォーム</h1>
<form action="/submit-k" method="post">
  <p><label>会社名（必須）<br><input type="text" name="company" required></label></p>
  <p><label>お名前（必須）<br><input type="text" name="name" required></label></p>
  <p><label>メールアドレス（必須）<br><input type="email" name="email" required></label></p>
  <p><label>職種（必須）<br><input type="text" name="job" required></label></p>
  <p><label>お問い合わせ内容（必須）<br><textarea name="m" required></textarea></label></p>
  <p><label><input type="checkbox" name="chk" value="1" required> 上記送信内容を確認したらチェックを入れてください</label></p>
  <button type="submit">確認画面へ</button>
</form></body></html>
