<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>アジサイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   アジサイ — プロトタイプ（β）
   就労継続支援B型事業所むけ 利用者・支援員・管理者ツール
   このファイル1つで動きます（インストール不要）。
   ・色を変えたいときは下の :root をいじってください。
   ・本番は Next.js / Supabase を想定。これはその見本（モック）です。
   ・データはこのブラウザの中だけに保存されます（localStorage）。
   ============================================================ */

:root{
  --bg:        #FBF7EE;   /* 背景：明るい木目・和紙のベース */
  --panel:     #FFFFFF;   /* カード・パネル */
  --main:      #6B8F5E;   /* メインカラー：葉・苔（緑） */
  --main-d:    #587A4D;   /* メイン：ホバー時の濃い緑 */
  --sub:       #F5ECD7;   /* サブ：木肌・和紙（ベージュ） */
  --accent:    #8A7BAF;   /* アクセント：アジサイの花（青紫） */
  --accent-d:  #75679A;
  --text:      #3E2009;   /* テキスト：幹・土（濃い茶色） */
  --muted:     #8A6F50;   /* 控えめな文字 */
  --border:    #C4A882;   /* ボーダー：枝・木目（薄茶） */
  --border-l:  #E6D9BE;   /* 薄いボーダー */
  --danger:    #B5564B;
  --ok:        #6B8F5E;
  --warn:      #C99A3A;
  --radius:    12px;
  --shadow:    0 4px 14px rgba(62,32,9,0.08);
  --shadow-h:  0 8px 22px rgba(62,32,9,0.14);
  --nav-h:     60px;   /* PC上部メニュー高さ */
  --tab-h:     64px;   /* スマホ下部タブ高さ */
  --font: "Noto Sans JP", system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:var(--font);
  color:var(--text);
  background:
    repeating-linear-gradient(90deg, rgba(196,168,130,0.05) 0 2px, transparent 2px 26px),
    linear-gradient(180deg, #FCF9F1, #F6EFE0);
  background-attachment:fixed;
  min-height:100vh;
  font-size:15px;
  line-height:1.7;
}
button{ font-family:var(--font); cursor:pointer; }
input, textarea, select{ font-family:var(--font); font-size:15px; }
h1,h2,h3,h4{ font-weight:700; margin:0; }
a{ color:var(--accent-d); }

/* ===== ボタン共通 ===== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  background:var(--main); color:#fff; border:none;
  border-radius:var(--radius); padding:11px 20px; font-size:15px; font-weight:500;
  box-shadow:0 3px 0 rgba(88,122,77,0.55); transition:background .18s, transform .06s, box-shadow .06s;
}
.btn:hover{ background:var(--main-d); }
.btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(88,122,77,0.4); }
.btn:disabled{ background:#cfc9bd; color:#fff; box-shadow:none; cursor:default; transform:none; }
.btn.accent{ background:var(--accent); box-shadow:0 3px 0 rgba(117,103,154,0.5); }
.btn.accent:hover{ background:var(--accent-d); }
.btn.ghost{ background:transparent; color:var(--main); border:1.5px solid var(--main); box-shadow:none; }
.btn.ghost:hover{ background:rgba(107,143,94,0.08); }
.btn.danger{ background:var(--danger); box-shadow:0 3px 0 rgba(150,60,50,0.5); }
.btn.sm{ padding:7px 14px; font-size:13.5px; }
.btn.block{ width:100%; }

.input, .textarea, .select{
  width:100%; background:#fff; border:1.5px solid var(--border-l); color:var(--text);
  border-radius:10px; padding:11px 13px; transition:border-color .15s;
}
.input:focus, .textarea:focus, .select:focus{ outline:none; border-color:var(--main); }
.textarea{ resize:vertical; min-height:90px; line-height:1.8; }
label.lb{ display:block; font-size:13px; color:var(--muted); margin:14px 0 5px; font-weight:500; }

.card{
  background:var(--panel); border:1px solid var(--border-l); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px; margin-bottom:14px;
}
.tag{ display:inline-block; font-size:12px; padding:2px 10px; border-radius:20px;
  background:var(--sub); color:var(--muted); border:1px solid var(--border-l); }
.tag.green{ background:rgba(107,143,94,0.14); color:var(--main-d); border-color:rgba(107,143,94,0.3); }
.tag.purple{ background:rgba(138,123,175,0.16); color:var(--accent-d); border-color:rgba(138,123,175,0.3); }
.tag.warn{ background:rgba(201,154,58,0.16); color:#9a7420; border-color:rgba(201,154,58,0.3); }
.tag.red{ background:rgba(181,86,75,0.14); color:var(--danger); border-color:rgba(181,86,75,0.3); }
.muted{ color:var(--muted); }
.center{ text-align:center; }
.row{ display:flex; gap:10px; align-items:center; }
.spread{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
.empty{ text-align:center; color:var(--muted); padding:36px 14px; }
.divider{ height:1px; background:var(--border-l); margin:14px 0; border:none; }

/* ============================================================
   ログイン画面
   ============================================================ */
#login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
.login-box{ width:min(420px,100%); background:var(--panel); border:1px solid var(--border-l);
  border-radius:18px; box-shadow:var(--shadow-h); padding:34px 30px; }
.brand{ text-align:center; margin-bottom:8px; }
.brand .logo-wrap{ width:84px; height:84px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; }
.brand img{ max-width:100%; max-height:100%; object-fit:contain; }
.brand .logo-fallback{ width:84px; height:84px; border-radius:50%;
  background:linear-gradient(135deg, var(--main), var(--accent)); position:relative;
  display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
.brand .logo-fallback svg{ width:52px; height:52px; }
.brand h1{ font-size:27px; letter-spacing:6px; color:var(--text); }
.brand p{ margin:4px 0 0; font-size:12.5px; color:var(--muted); letter-spacing:2px; }
.role-tabs{ display:flex; gap:6px; margin:22px 0 18px; background:var(--sub); padding:5px; border-radius:12px; }
.role-tab{ flex:1; border:none; background:transparent; color:var(--muted); padding:9px 4px;
  border-radius:9px; font-size:13.5px; font-weight:500; transition:.15s; }
.role-tab.on{ background:#fff; color:var(--main-d); box-shadow:0 2px 6px rgba(62,32,9,0.08); }
.login-hint{ font-size:12px; color:var(--muted); text-align:center; margin-top:16px; line-height:1.8; }
.demo-pills{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-top:8px; }
.demo-pill{ font-size:11.5px; background:var(--sub); border:1px solid var(--border-l); color:var(--muted);
  padding:3px 10px; border-radius:20px; }

/* ============================================================
   アプリ本体レイアウト
   ============================================================ */
#app{ display:none; min-height:100vh; }
body.in-app #app{ display:block; }
body.in-app #login{ display:none; }

/* PC上部固定メニュー */
#topnav{ position:fixed; top:0; left:0; right:0; height:var(--nav-h); z-index:50;
  background:rgba(255,255,255,0.92); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border-l); display:flex; align-items:center;
  padding:0 18px; gap:6px; box-shadow:0 2px 10px rgba(62,32,9,0.05); }
#topnav .nav-brand{ display:flex; align-items:center; gap:9px; margin-right:14px; }
#topnav .nav-brand .lw{ width:34px; height:34px; display:flex; align-items:center; justify-content:center; }
#topnav .nav-brand img{ max-width:100%; max-height:100%; }
#topnav .nav-brand .fb{ width:34px; height:34px; border-radius:50%;
  background:linear-gradient(135deg,var(--main),var(--accent)); display:flex; align-items:center; justify-content:center; }
#topnav .nav-brand .fb svg{ width:22px; height:22px; }
#topnav .nav-brand b{ font-size:18px; letter-spacing:3px; }
.nav-links{ display:flex; gap:2px; flex:1; overflow-x:auto; scrollbar-width:none; }
.nav-links::-webkit-scrollbar{ display:none; }
.nav-link{ border:none; background:transparent; color:var(--muted); padding:8px 13px; border-radius:9px;
  font-size:14px; font-weight:500; white-space:nowrap; display:flex; align-items:center; gap:6px; transition:.15s; }
.nav-link:hover{ background:var(--sub); color:var(--text); }
.nav-link.on{ background:rgba(107,143,94,0.14); color:var(--main-d); }
.nav-link svg{ width:18px; height:18px; }
.nav-link .badge{ background:var(--danger); color:#fff; font-size:10px; font-weight:700;
  min-width:17px; height:17px; border-radius:9px; padding:0 4px; display:inline-flex; align-items:center; justify-content:center; }
.nav-right{ display:flex; align-items:center; gap:10px; margin-left:8px; }
.nav-user{ font-size:13px; color:var(--muted); white-space:nowrap; }
.nav-user b{ color:var(--text); }
.icon-btn{ border:1px solid var(--border-l); background:#fff; width:38px; height:38px; border-radius:10px;
  display:flex; align-items:center; justify-content:center; color:var(--main); transition:.15s; }
.icon-btn:hover{ background:var(--sub); }
.icon-btn svg{ width:19px; height:19px; }

/* メイン領域 */
#main{ max-width:880px; margin:0 auto; padding:calc(var(--nav-h) + 22px) 18px 40px; }
.page-head{ margin-bottom:18px; }
.page-head h2{ font-size:22px; letter-spacing:1px; display:flex; align-items:center; gap:9px; }
.page-head h2 svg{ width:24px; height:24px; color:var(--main); }
.page-head .ph-sub{ font-size:13.5px; color:var(--muted); margin-top:3px; }

/* スマホ下部タブ */
#tabbar{ display:none; position:fixed; bottom:0; left:0; right:0; height:var(--tab-h); z-index:50;
  background:rgba(255,255,255,0.96); backdrop-filter:blur(8px); border-top:1px solid var(--border-l);
  padding-bottom:env(safe-area-inset-bottom); }
.tabbar-inner{ display:flex; height:var(--tab-h); }
.tab-item{ flex:1; border:none; background:transparent; color:var(--muted); display:flex;
  flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; position:relative; }
.tab-item svg{ width:23px; height:23px; }
.tab-item.on{ color:var(--main); }
.tab-item .badge{ position:absolute; top:7px; left:50%; margin-left:6px; background:var(--danger); color:#fff;
  font-size:9px; font-weight:700; min-width:15px; height:15px; border-radius:8px; padding:0 3px;
  display:inline-flex; align-items:center; justify-content:center; }

/* ===== レスポンシブ：スマホ ===== */
@media (max-width:720px){
  #topnav .nav-links, #topnav .nav-user{ display:none; }
  #topnav{ justify-content:space-between; }
  #tabbar{ display:block; }
  #main{ padding:calc(var(--nav-h) + 16px) 14px calc(var(--tab-h) + 24px); }
  .page-head h2{ font-size:19px; }
}

/* ============================================================
   ホーム
   ============================================================ */
.welcome{ background:linear-gradient(135deg, var(--main), #7fa06f); color:#fff;
  border-radius:16px; padding:22px 24px; margin-bottom:18px; box-shadow:var(--shadow);
  position:relative; overflow:hidden; }
.welcome::after{ content:""; position:absolute; right:-20px; top:-20px; width:150px; height:150px;
  background:radial-gradient(circle, rgba(255,255,255,0.18), transparent 70%); }
.welcome h2{ font-size:21px; position:relative; }
.welcome p{ margin:5px 0 0; font-size:13.5px; opacity:.92; position:relative; }
.shortcut-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(140px,1fr)); gap:12px; margin-bottom:8px; }
.shortcut{ background:var(--panel); border:1px solid var(--border-l); border-radius:14px; padding:16px;
  display:flex; flex-direction:column; gap:8px; box-shadow:var(--shadow); transition:.16s; text-align:left; }
.shortcut:hover{ transform:translateY(-2px); box-shadow:var(--shadow-h); border-color:var(--main); }
.shortcut .sc-ic{ width:42px; height:42px; border-radius:12px; background:rgba(107,143,94,0.12);
  display:flex; align-items:center; justify-content:center; color:var(--main); }
.shortcut .sc-ic svg{ width:24px; height:24px; }
.shortcut .sc-ic.purple{ background:rgba(138,123,175,0.16); color:var(--accent); }
.shortcut b{ font-size:15px; }
.shortcut span{ font-size:12px; color:var(--muted); }

.section-title{ font-size:15px; font-weight:700; margin:22px 0 11px; display:flex; align-items:center; gap:7px; color:var(--text); }
.section-title svg{ width:19px; height:19px; color:var(--main); }

.notice{ display:flex; gap:13px; padding:14px 16px; }
.notice .n-date{ font-size:11.5px; color:var(--muted); min-width:54px; }
.notice .n-body b{ display:block; font-size:14.5px; margin-bottom:2px; }
.notice .n-body p{ margin:0; font-size:13px; color:var(--muted); }
.notice.pin{ border-left:3px solid var(--accent); }

/* ============================================================
   アンケート（気分スタンプ）
   ============================================================ */
.mood-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:6px 0 4px; }
.mood{ width:70px; height:84px; border:2px solid var(--border-l); background:#fff; border-radius:14px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; transition:.14s; }
.mood:hover{ border-color:var(--main); transform:translateY(-2px); }
.mood.on{ border-color:var(--main); background:rgba(107,143,94,0.1); box-shadow:0 4px 12px rgba(107,143,94,0.22); }
.mood .face{ font-size:30px; line-height:1; }
.mood .ml{ font-size:11.5px; color:var(--muted); }
.mood.on .ml{ color:var(--main-d); font-weight:600; }
.done-banner{ text-align:center; padding:30px 16px; }
.done-banner .big{ font-size:46px; }

/* ============================================================
   チャット
   ============================================================ */
.chat-wrap{ display:flex; flex-direction:column; height:calc(100vh - var(--nav-h) - 90px); min-height:380px; }
.chat-peers{ display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px; scrollbar-width:none; }
.chat-peers::-webkit-scrollbar{ display:none; }
.peer{ flex:0 0 auto; border:1.5px solid var(--border-l); background:#fff; border-radius:30px;
  padding:7px 15px 7px 8px; display:flex; align-items:center; gap:8px; transition:.14s; }
.peer.on{ border-color:var(--main); background:rgba(107,143,94,0.1); }
.peer .av{ width:30px; height:30px; border-radius:50%; background:var(--accent); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; }
.peer .pn{ font-size:13.5px; font-weight:500; }
.chat-log{ flex:1; overflow-y:auto; padding:12px 4px; display:flex; flex-direction:column; gap:10px; }
.msg{ max-width:74%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.65; position:relative; }
.msg .mt{ font-size:10.5px; margin-top:4px; opacity:.7; display:flex; gap:6px; align-items:center; }
.msg.them{ align-self:flex-start; background:#fff; border:1px solid var(--border-l); border-bottom-left-radius:5px; }
.msg.me{ align-self:flex-end; background:var(--main); color:#fff; border-bottom-right-radius:5px; }
.msg.me .mt{ justify-content:flex-end; }
.read-mark{ font-size:10px; }
.chat-input{ display:flex; gap:8px; padding-top:10px; border-top:1px solid var(--border-l); }
.chat-input .input{ border-radius:22px; }
.chat-input .btn{ flex:0 0 auto; border-radius:22px; padding:11px 18px; }
.date-sep{ text-align:center; font-size:11.5px; color:var(--muted); margin:6px 0; }

/* ============================================================
   カレンダー
   ============================================================ */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.cal-head h3{ font-size:18px; }
.cal-nav{ display:flex; gap:6px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:5px; }
.cal-dow{ text-align:center; font-size:12px; color:var(--muted); padding:4px 0; font-weight:500; }
.cal-cell{ min-height:74px; background:#fff; border:1px solid var(--border-l); border-radius:9px; padding:5px;
  display:flex; flex-direction:column; gap:3px; transition:.12s; }
.cal-cell:hover{ border-color:var(--main); }
.cal-cell.other{ background:transparent; border-color:transparent; }
.cal-cell .dn{ font-size:12px; color:var(--muted); font-weight:500; }
.cal-cell.today .dn{ background:var(--main); color:#fff; width:21px; height:21px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; }
.cal-cell.sun .dn{ color:var(--danger); }
.cal-cell.sat .dn{ color:var(--accent-d); }
.ev{ font-size:10.5px; padding:2px 5px; border-radius:5px; line-height:1.4; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; }
.ev.facility{ background:rgba(107,143,94,0.16); color:var(--main-d); border-left:2px solid var(--main); }
.ev.personal{ background:rgba(138,123,175,0.16); color:var(--accent-d); border-left:2px solid var(--accent); }
.cal-legend{ display:flex; gap:16px; margin-top:12px; font-size:12.5px; color:var(--muted); }
.cal-legend i{ width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:5px; vertical-align:middle; }

/* ============================================================
   相談フォーム / 受信箱
   ============================================================ */
.status-pill{ font-size:11.5px; padding:3px 11px; border-radius:20px; font-weight:600; }
.status-open{ background:rgba(181,86,75,0.14); color:var(--danger); }
.status-prog{ background:rgba(201,154,58,0.18); color:#9a7420; }
.status-done{ background:rgba(107,143,94,0.16); color:var(--main-d); }
.inbox-item{ cursor:pointer; transition:.14s; }
.inbox-item:hover{ border-color:var(--main); transform:translateY(-1px); }

/* メモ履歴 */
.memo-hist{ font-size:12px; color:var(--muted); }
.hist-item{ padding:8px 0; border-bottom:1px solid var(--border-l); display:flex; justify-content:space-between; gap:10px; }
.hist-item:last-child{ border:none; }

/* リンク集・マニュアル */
.link-item{ display:flex; align-items:center; gap:12px; padding:13px 16px; }
.link-item .li-ic{ width:38px; height:38px; border-radius:10px; background:var(--sub); flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; color:var(--main); }
.link-item .li-ic svg{ width:20px; height:20px; }
.link-item .li-body{ flex:1; min-width:0; }
.link-item b{ font-size:14.5px; display:block; }
.link-item span{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }

/* テーブル風（管理） */
.list-row{ display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border-l); }
.list-row:last-child{ border:none; }
.avatar{ width:38px; height:38px; border-radius:50%; background:var(--main); color:#fff; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
.avatar.purple{ background:var(--accent); }

/* ============================================================
   モーダル / トースト
   ============================================================ */
#modal{ position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
  background:rgba(62,32,9,0.42); backdrop-filter:blur(3px); padding:20px; }
#modal.show{ display:flex; }
.sheet{ background:var(--panel); border-radius:16px; width:min(480px,100%); max-height:88vh; overflow:auto;
  padding:24px; box-shadow:var(--shadow-h); animation:rise .26s ease; }
@keyframes rise{ from{ transform:translateY(16px); opacity:0; } to{ transform:none; opacity:1; } }
.sheet h3{ font-size:18px; margin-bottom:4px; }
.sheet .sh-x{ float:right; border:none; background:none; font-size:22px; color:var(--muted); cursor:pointer; line-height:1; }

#toast{ position:fixed; bottom:84px; left:50%; transform:translateX(-50%) translateY(20px); z-index:90;
  background:var(--text); color:#fff; padding:12px 22px; border-radius:30px; font-size:14px;
  box-shadow:var(--shadow-h); opacity:0; transition:.3s; pointer-events:none; max-width:88%; text-align:center; }
#toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.ok{ background:var(--main); }
#toast.err{ background:var(--danger); }

.seg{ display:inline-flex; border:1.5px solid var(--border-l); border-radius:10px; overflow:hidden; }
.seg button{ border:none; background:#fff; color:var(--muted); padding:8px 14px; font-size:13.5px; }
.seg button.on{ background:var(--main); color:#fff; }
</style>
</head>
<body>

<!-- ロゴSVG（透過PNGが無いとき用のフォールバック図案：木＋アジサイ） -->
<svg style="display:none">
  <symbol id="ajisai-mark" viewBox="0 0 48 48">
    <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    </div>

      <div class="chat-log" id="chat-log"></div>
      <div class="chat-input">
        <input class="input" id="chat-text" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" onclick="sendChat()">${svg(IC.send,2)}</button>
      </div>
    </div>`;
};
AFTER.chat = function(){ renderChatLog(); };
function selectPeer(pid){ Store.set('chat_sel_'+session.id, pid); render(); }
function chatThreadKey(userId, staffId){ return 'chat_'+userId+'_'+staffId; }
function currentChatPeer(){
  if(session.role==='user') return Store.get('chat_sel_'+session.id) || SEED.staff[0].id;
  return Store.get('schat_sel_'+session.id) || SEED.users[0].id;
}
function renderChatLog(){
  const log=document.getElementById('chat-log'); if(!log)return;
  let userId, staffId;
  if(session.role==='user'){ userId=session.id; staffId=currentChatPeer(); }
  else { staffId=session.id; userId=currentChatPeer(); }
  const thread=Store.get(chatThreadKey(userId,staffId), []);
  // 自分宛の相手メッセージを既読化
  let changed=false;
  thread.forEach(msg=>{ if(msg.from!==session.role && !msg.read){ msg.read=true; changed=true; } });
  if(changed) Store.set(chatThreadKey(userId,staffId), thread);
  if(!thread.length){ log.innerHTML=`<div class="empty">まだメッセージはありません。<br>最初のひとことを送ってみましょう。</div>`; buildNav(); return; }
  log.innerHTML = thread.map(msg=>{
    const mine = msg.from===session.role;
    const read = mine && msg.read ? `<span class="read-mark">既読</span>` : '';
    return `<div class="msg ${mine?'me':'them'}">${esc(msg.text)}<div class="mt">${read}<span>${nowLabel(msg.at)}</span></div></div>`;
  }).join('');
  log.scrollTop=log.scrollHeight;
  buildNav();
}
function sendChat(){
  const t=document.getElementById('chat-text'); const text=t.value.trim(); if(!text)return;
  let userId, staffId;
  if(session.role==='user'){ userId=session.id; staffId=currentChatPeer(); }
  else { staffId=session.id; userId=currentChatPeer(); }
  const key=chatThreadKey(userId,staffId);
  const thread=Store.get(key, []);
  thread.push({ from:session.role, text, at:Date.now(), read:false });
  Store.set(key, thread);
  t.value='';
  renderChatLog();
  // 利用者→支援員のときはメール通知（本番イメージ）を表示
  if(session.role==='user'){
    const st=SEED.staff.find(s=>s.id===staffId);
    toast(`📧 ${st.name}（${st.email}）へ通知メールを送信しました`);
  }
}
function chatUnreadCount(){
  let n=0;
  if(session.role==='user'){
    SEED.staff.forEach(s=>{ Store.get(chatThreadKey(session.id,s.id),[]).forEach(m=>{ if(m.from!=='user'&&!m.read)n++; }); });
  } else if(session.role==='staff'){
    SEED.users.forEach(u=>{ Store.get(chatThreadKey(u.id,session.id),[]).forEach(m=>{ if(m.from!=='staff'&&!m.read)n++; }); });
  }
  return n;
}

function calView(isStaff){
  const title = isStaff? '施設の予定を登録・編集できます。利用者の個人予定も色分けで表示されます。'

        <div class="cal-nav">
          <button class="icon-btn" onclick="calMove(-1)">${svg(IC.chevL,2)}</button>
          <button class="icon-btn" onclick="calMove(1)">${svg(IC.chevR,2)}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${['日','月','火','水','木','金','土'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${calCells(isStaff)}
      </div>
      <div class="cal-legend">
        <span><i style="background:var(--main)"></i>施設の予定</span>
        <span><i style="background:var(--accent)"></i>${isStaff?'利用者の個人予定':'自分の予定'}</span>
      </div>
    </div>
    <button class="btn block" onclick="openEventModal()">${svg(IC.plus,2)} ${isStaff?'施設の予定を追加':'自分の予定を追加'}</button>`;
}
function calMove(d){ calMonth+=d; if(calMonth<0){calMonth=11;calYear--;} if(calMonth>11){calMonth=0;calYear++;} render(); }
function getFacilityEvents(){ return Store.get('facilityEvents', SEED.facilityEvents); }
function getPersonalEvents(uid){ return Store.get('events_'+uid, []); }
function calCells(isStaff){
  const first=new Date(calYear,calMonth,1).getDay();
  const days=new Date(calYear,calMonth+1,0).getDate();
  const today=new Date();
  const fac=getFacilityEvents();
  // 個人予定：利用者は自分、支援員は全員ぶん
  let personal=[];
  if(isStaff){ SEED.users.forEach(u=>getPersonalEvents(u.id).forEach(e=>personal.push({...e, who:u.name}))); }
  else { personal=getPersonalEvents(session.id); }
  let cells='';
  for(let i=0;i<first;i++) cells+=`<div class="cal-cell other"></div>`;
  for(let d=1;d<=days;d++){
    const dow=new Date(calYear,calMonth,d).getDay();
    const isToday = today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    const fe=fac.filter(e=>e.d===d);
    const pe=personal.filter(e=>e.d===d);
    cells+=`<div class="cal-cell ${isToday?'today':''} ${dow===0?'sun':''} ${dow===6?'sat':''}" onclick="openEventModal(${d})">
      <span class="dn">${d}</span>
      ${fe.map(e=>`<div class="ev facility" title="${esc(e.title)}">${esc(e.title)}</div>`).join('')}
      ${pe.map(e=>`<div class="ev personal" title="${esc((e.who?e.who+'：':'')+e.title)}">${e.who?'・':''}${esc(e.title)}</div>`).join('')}
    </div>`;
  }
  return cells;
}
function openEventModal(day){
  const isStaff = (current==='s_calendar');
  const d = day || new Date().getDate();
  openModal(`
    <h3>${isStaff?'施設の予定を追加':'予定を追加'}</h3>

  const d=parseInt(val('ev-day'),10); const time=val('ev-time'); const t=val('ev-title').trim();

  const title = time? `${time} ${t}` : t;

  else { const pe=getPersonalEvents(session.id); pe.push({d, title}); Store.set('events_'+session.id, pe); }
  closeModal(); toast('予定を追加しました','ok'); render();

    <div style="height:14px"></div><button class="btn accent block" onclick="saveManual('${id||''}')">保存する</button>`);
}
function saveManual(id){
  const list=Store.get('manuals', SEED.manuals);
  if(!val('mn-title')){ toast('タイトルを入れてください','err'); return; }
  if(id){ const m=list.find(x=>x.id===id); m.title=val('mn-title'); m.body=val('mn-body'); }
  else { list.push({id:'m'+Date.now(), title:val('mn-title'), body:val('mn-body')}); }
  Store.set('manuals', list); closeModal(); toast('保存しました','ok'); render();
}
function delManual(id){ Store.set('manuals', Store.get('manuals',SEED.manuals).filter(m=>m.id!==id)); toast('削除しました'); render(); }

/* ============================================================
   ＝＝＝ 支援員：利用者一覧（ダッシュボード） ＝＝＝
   ============================================================ */
ROUTES.dash = function(){
  return head('dash','利用者一覧', '利用者を選ぶと、プロフィールとアンケートを確認できます。')+`
    <div class="card">
      ${SEED.users.map(u=>{
        const last=Store.get('survey_'+u.id+'_'+todayKey());
        const mood=last?MOODS.find(m=>m.v===last.mood):null;
        return `<div class="list-row">
          <div class="avatar">${u.name[0]}</div>
          <div style="flex:1"><b>${u.name}</b><div class="muted" style="font-size:12px">${last?'今日のアンケート：'+(mood?mood.f+' '+mood.l:'記入ずみ'):'今日は未記入'}</div></div>
          <button class="btn ghost sm" onclick="openUserDetail('${u.id}')">詳しく見る</button>
        </div>`;
      }).join('')}
    </div>`;
};
function openUserDetail(uid){
  const u=SEED.users.find(x=>x.id===uid);
  const p=Store.get('profile_'+uid, {care:'',worry:'',like:''});
  const surveys=Store.get('surveys', []).filter(s=>s.userId===uid).slice(0,5);
  openModal(`
    <button class="sh-x" onclick="closeModal()">×</button>
    <h3>${u.name} さん</h3>
    <div class="section-title" style="margin-top:14px">${svg(IC.user)} プロフィール</div>
    ${p.care||p.worry||p.like? `
      ${p.care?`<p class="muted" style="font-size:12px;margin:6px 0 2px">配慮してほしいこと</p><p style="margin:0 0 8px">${esc(p.care)}</p>`:''}
      ${p.worry?`<p class="muted" style="font-size:12px;margin:6px 0 2px">最近の悩み</p><p style="margin:0 0 8px">${esc(p.worry)}</p>`:''}
      ${p.like?`<p class="muted" style="font-size:12px;margin:6px 0 2px">得意・好き</p><p style="margin:0 0 8px">${esc(p.like)}</p>`:''}`
      : `<p class="muted" style="font-size:13px">まだ記入されていません</p>`}
    <div class="section-title">${svg(IC.survey)} 最近のアンケート</div>
    ${surveys.length? surveys.map(s=>{ const m=MOODS.find(x=>x.v===s.mood); return `
      <div style="background:var(--sub);border-radius:9px;padding:10px 12px;margin-bottom:7px">
        <div class="spread"><b>${m?m.f+' '+m.l:'—'}</b><span class="muted" style="font-size:11px">${dateLabel(s.at)}</span></div>
        ${s.diary?`<p style="margin:5px 0 0;font-size:13px">${esc(s.diary)}</p>`:''}
      </div>`; }).join('') : `<p class="muted" style="font-size:13px">記録はまだありません</p>`}
  `);
}

/* ============================================================
   ＝＝＝ 支援員：アンケート閲覧 ＝＝＝
   ============================================================ */
ROUTES.s_survey = function(){
  const all=Store.get('surveys', []);
  return head('survey','アンケート結果', '利用者ごとに記録が蓄積されます。')+`
    ${all.length? all.map(s=>{ const m=MOODS.find(x=>x.v===s.mood); const u=SEED.users.find(x=>x.id===s.userId);
      return `<div class="card">
        <div class="spread"><div class="row"><div class="avatar" style="width:30px;height:30px;font-size:13px">${u?u.name[0]:'?'}</div><b>${u?u.name:'利用者'}</b></div>
          <span class="muted" style="font-size:12px">${dateLabel(s.at)}</span></div>
        <div style="font-size:24px;margin:8px 0 4px">${m?m.f:''} <span style="font-size:14px;color:var(--muted)">${m?m.l:''}</span></div>
        ${fieldShow('一日の感想', s.diary)}${fieldShow('よかったこと', s.good)}${fieldShow('気になったこと', s.worry)}${fieldShow('意見・質問', s.opinion)}
      </div>`; }).join('') : `<div class="card empty">アンケートはまだありません。<br><span style="font-size:12px">利用者でログインして送信すると、ここに表示されます。</span></div>`}`;
};

/* ============================================================
   ＝＝＝ 支援員：相談受信箱（ステータス・タスク・返信） ＝＝＝
   ============================================================ */
ROUTES.s_consult = function(){
  const all=getConsults().filter(c=> session.role==='admin' ? true : c.staffId===session.id);
  return head('inbox','相談受信箱', session.role==='admin'?'全支援員あての相談です。':'あなた宛の相談です。ステータスを管理できます。')+`
    ${all.length? all.map(c=>{ const st=consultStatus(c); const u=SEED.users.find(x=>x.id===c.userId);
      return `<div class="card inbox-item" onclick="openConsultDetail('${c.id}')">
        <div class="spread">
          <div class="row"><div class="avatar purple" style="width:30px;height:30px;font-size:13px">${u?u.name[0]:'?'}</div><b>${c.userName}</b></div>
          <span class="status-pill ${st.cls}">${st.label}</span>
        </div>
        <div class="row" style="margin:9px 0 6px"><span class="tag purple">${c.cat}</span><span class="tag">${c.method}</span></div>
        <p style="margin:0;white-space:pre-wrap;font-size:14px">${esc(c.body)}</p>
        <div class="muted" style="font-size:11.5px;margin-top:8px">${nowLabel(c.at)} ・ ${staffName(c.staffId)} 宛</div>
      </div>`; }).join('') : `<div class="card empty">相談はまだありません。<br><span style="font-size:12px">利用者でログインして相談を送ると、ここに届きます。</span></div>`}`;
};
function openConsultDetail(id){
  const c=getConsults().find(x=>x.id===id); const st=consultStatus(c);
  openModal(`
    <button class="sh-x" onclick="closeModal()">×</button>
    <h3>${c.userName} さんの相談</h3>
    <div class="row" style="margin:6px 0"><span class="tag purple">${c.cat}</span><span class="tag">${c.method}</span><span class="status-pill ${st.cls}">${st.label}</span></div>
    <p style="white-space:pre-wrap;background:var(--sub);border-radius:9px;padding:11px 13px;margin:8px 0">${esc(c.body)}</p>

    <label class="lb">対応ステータス</label>
    <div class="seg" id="st-seg">
      <button class="${c.status==='open'?'on':''}" onclick="setConsultStatus('${id}','open')">未対応</button>
      <button class="${c.status==='prog'?'on':''}" onclick="setConsultStatus('${id}','prog')">対応中</button>
      <button class="${c.status==='done'?'on':''}" onclick="setConsultStatus('${id}','done')">完了</button>
    </div>

    <label class="lb">面談・タスク（日時を決めたら記録）</label>
    <div class="row"><input class="input" id="cs-task" placeholder="例：6/28 14:00〜" value="${c.task||''}"><button class="btn sm" onclick="setConsultTask('${id}')">登録</button></div>

    <label class="lb">チャットで返信</label>
    <textarea class="textarea" id="cs-reply" placeholder="この内容は利用者へのチャットにも届きます"></textarea>
    <div style="height:12px"></div>
    <button class="btn block" onclick="replyConsult('${id}')">${svg(IC.send,2)} 返信を送る</button>
  `);
}
function setConsultStatus(id, st){ const all=getConsults(); const c=all.find(x=>x.id===id); c.status=st; saveConsults(all); toast('ステータスを更新'); buildNav(); openConsultDetail(id); }
function setConsultTask(id){ const all=getConsults(); const c=all.find(x=>x.id===id); c.task=val('cs-task'); saveConsults(all); toast('面談予定を登録しました','ok'); }
function replyConsult(id){
  const text=val('cs-reply').trim(); if(!text){ toast('返信を書いてください','err'); return; }
  const all=getConsults(); const c=all.find(x=>x.id===id);
  c.replies=c.replies||[]; c.replies.push({body:text, at:Date.now()});
  if(c.status==='open') c.status='prog';
  saveConsults(all);
  // チャットスレッドにも反映（支援員→利用者）
  const key=chatThreadKey(c.userId, c.staffId);
  const thread=Store.get(key, []);
  thread.push({ from:'staff', text:'【相談への返信】'+text, at:Date.now(), read:false });
  Store.set(key, thread);
  closeModal(); toast('返信しました（チャットにも送信）','ok'); buildNav(); render();
}
function consultStatus(c){
  if(c.status==='done') return {cls:'status-done', label:'完了'};
  if(c.status==='prog') return {cls:'status-prog', label:'対応中'};
  return {cls:'status-open', label:'未対応'};
}
function consultUnhandledCount(){
  const all=getConsults();
  if(session.role==='user') return 0;
  return all.filter(c=>(session.role==='admin'||c.staffId===session.id) && c.status!=='done').length;
}

/* ============================================================
   ＝＝＝ 支援員：チャット（相手＝利用者） ＝＝＝
   ============================================================ */
ROUTES.s_chat = function(){
  const peers=SEED.users;
  let sel=Store.get('schat_sel_'+session.id) || peers[0].id;
  return head('chat','チャット', '自分あてのチャットだけが表示されます。')+`
    <div class="chat-peers">
      ${peers.map(p=>{
        let unread=0; Store.get(chatThreadKey(p.id, session.id),[]).forEach(m=>{ if(m.from!=='staff'&&!m.read)unread++; });
        return `<button class="peer ${p.id===sel?'on':''}" onclick="selectSPeer('${p.id}')">
          <span class="av">${p.name[0]}</span><span class="pn">${p.name}</span>${unread?`<span class="badge" style="position:static">${unread}</span>`:''}</button>`;
      }).join('')}
    </div>
    <div class="chat-wrap">
      <div class="chat-log" id="chat-log"></div>
      <div class="chat-input">
        <input class="input" id="chat-text" placeholder="メッセージを入力" onkeydown="if(event.key==='Enter')sendChat()">
        <button class="btn" onclick="sendChat()">${svg(IC.send,2)}</button>
      </div>
    </div>`;
};
AFTER.s_chat = function(){ renderChatLog(); };
function selectSPeer(uid){ Store.set('schat_sel_'+session.id, uid); render(); }

/* ============================================================
   ＝＝＝ 支援員/管理者：お知らせ管理 ＝＝＝
   ============================================================ */
ROUTES.s_notice = function(){
  const list=getNotices();
  return head('bell','お知らせ管理', '投稿・編集・削除がすぐ反映されます。')+`
    <button class="btn block" onclick="editNotice()" style="margin-bottom:14px">${svg(IC.plus,2)} お知らせを投稿</button>
    ${list.map(n=>`<div class="card notice ${n.pin?'pin':''}">
      <div class="n-date">${n.date}</div>
      <div class="n-body" style="flex:1"><b>${n.pin?'📌 ':''}${esc(n.title)}</b><p>${esc(n.body)}</p></div>
      <div class="row"><button class="icon-btn" onclick="editNotice('${n.id}')">${svg(IC.edit)}</button><button class="icon-btn" onclick="delNotice('${n.id}')">${svg(IC.trash)}</button></div>
    </div>`).join('')}`;
};
function editNotice(id){
  const list=getNotices();
  const n = id? list.find(x=>x.id===id) : {title:'', body:'', pin:false};
  openModal(`<h3>${id?'お知らせを編集':'お知らせを投稿'}</h3>
    <label class="lb">タイトル</label><input class="input" id="nt-title" value="${esc(n.title)}">
    <label class="lb">本文</label><textarea class="textarea" id="nt-body">${esc(n.body)}</textarea>
    <label class="lb"><input type="checkbox" id="nt-pin" ${n.pin?'checked':''}> 上部に固定（📌）</label>
    <div style="height:12px"></div><button class="btn block" onclick="saveNotice('${id||''}')">保存する</button>`);
}
function saveNotice(id){
  const list=getNotices();
  if(!val('nt-title')){ toast('タイトルを入れてください','err'); return; }
  const pin=document.getElementById('nt-pin').checked;
  if(id){ const n=list.find(x=>x.id===id); n.title=val('nt-title'); n.body=val('nt-body'); n.pin=pin; }
  else {
    const d=new Date();
    list.unshift({id:'n'+Date.now(), date:`${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`, pin, title:val('nt-title'), body:val('nt-body')});
  }
  saveNotices(list); closeModal(); toast('保存しました','ok'); render();
}
function delNotice(id){ saveNotices(getNotices().filter(n=>n.id!==id)); toast('削除しました'); render(); }

/* ============================================================
   ＝＝＝ 管理者：支援員管理 ＝＝＝
   ============================================================ */
ROUTES.a_staff = function(){
  const list=Store.get('staffList', SEED.staff);
  return head('users','支援員管理', 'アカウントの登録・削除ができます。')+`
    <button class="btn block accent" onclick="addStaffModal()" style="margin-bottom:14px">${svg(IC.plus,2)} 支援員を登録</button>
    <div class="card">
      ${list.map(s=>`<div class="list-row">
        <div class="avatar">${s.name[0]}</div>
        <div style="flex:1"><b>${esc(s.name)}</b><div class="muted" style="font-size:12px">${esc(s.email)}</div></div>
        <button class="btn ghost sm danger" onclick="delStaff('${s.id}')">削除</button>
      </div>`).join('')}
    </div>`;
};
function addStaffModal(){
  openModal(`<h3>支援員を登録</h3>
    <label class="lb">お名前</label><input class="input" id="sf-name" placeholder="例：渡辺 支援員">
    <label class="lb">メールアドレス</label><input class="input" id="sf-email" placeholder="mail@ajisai.jp">
    <p class="muted" style="font-size:12px;margin:6px 0 0">※ 本番では、このメール宛に初期パスワード設定の案内が届きます</p>
    <div style="height:14px"></div><button class="btn accent block" onclick="addStaff()">登録する</button>`);
}
function addStaff(){
  const list=Store.get('staffList', SEED.staff);
  if(!val('sf-name')||!val('sf-email')){ toast('名前とメールを入れてください','err'); return; }
  list.push({id:'s'+Date.now(), name:val('sf-name'), email:val('sf-email')});
  Store.set('staffList', list); closeModal(); toast('支援員を登録しました','ok'); render();
}
function delStaff(id){ Store.set('staffList', Store.get('staffList',SEED.staff).filter(s=>s.id!==id)); toast('削除しました'); render(); }

/* ============================================================
   ＝＝＝ 管理者：利用者管理 ＝＝＝
   ============================================================ */
ROUTES.a_users = function(){
  const list=Store.get('userList', SEED.users);
  return head('user','利用者管理', '名前の登録・削除・パスワードのリセットができます。')+`
    <button class="btn block" onclick="addUserModal()" style="margin-bottom:14px">${svg(IC.plus,2)} 利用者を登録</button>
    <div class="card">
      ${list.map(u=>{ const hasPw=!!Store.get('userpw_'+u.id);
        return `<div class="list-row">
        <div class="avatar">${u.name[0]}</div>
        <div style="flex:1"><b>${esc(u.name)}</b><div class="muted" style="font-size:12px">${hasPw?'パスワード設定ずみ':'未ログイン（初回設定まち）'}</div></div>
        <button class="btn ghost sm" onclick="resetPw('${u.id}')">${svg(IC.key)} リセット</button>
        <button class="btn ghost sm danger" onclick="delUser('${u.id}')">削除</button>
      </div>`; }).join('')}
    </div>
    <p class="muted center" style="font-size:12px">※ パスワードの中身は支援員・管理者には表示されません</p>`;
};
function addUserModal(){
  openModal(`<h3>利用者を登録</h3>
    <label class="lb">お名前</label><input class="input" id="us-name" placeholder="例：中村 みどり">
    <p class="muted" style="font-size:12px;margin:6px 0 0">※ 利用者は初回ログイン時に自分でパスワードを設定します</p>
    <div style="height:14px"></div><button class="btn block" onclick="addUser()">登録する</button>`);
}
function addUser(){
  const list=Store.get('userList', SEED.users);
  if(!val('us-name')){ toast('名前を入れてください','err'); return; }
  list.push({id:'u'+Date.now(), name:val('us-name')});
  Store.set('userList', list); closeModal(); toast('利用者を登録しました','ok'); render();
}
function delUser(id){ Store.set('userList', Store.get('userList',SEED.users).filter(u=>u.id!==id)); toast('削除しました'); render(); }
function resetPw(id){ Store.set('userpw_'+id, null); localStorage.removeItem('ajisai_userpw_'+id); toast('パスワードをリセットしました（利用者が再設定します）','ok'); render(); }

/* ============================================================
   データ取得ヘルパ（Seedとローカルをマージ）
   ============================================================ */
function getNotices(){ return Store.get('notices', SEED.notices); }
function saveNotices(l){ Store.set('notices', l); }
function getConsults(){ return Store.get('consults', []); }
function saveConsults(l){ Store.set('consults', l); }
function staffName(id){ const s=SEED.staff.find(x=>x.id===id); return s?s.name:'支援員'; }

/* ============================================================
   小物（モーダル・トースト・整形）
   ============================================================ */
function openModal(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('modal').classList.add('show'); }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });
function confirmModal(title, msg, onok){
  openModal(`<div class="center"><div style="font-size:42px">✓</div><h3 style="margin:6px 0">${title}</h3><p class="muted">${msg}</p><div style="height:14px"></div><button class="btn block" onclick="closeModal();(${onok?'__onok':'function(){}'})()">とじる</button></div>`);
  window.__onok = onok || function(){};
}
function toast(msg, type){ const t=document.getElementById('toast'); t.textContent=msg; t.className=''; if(type)t.classList.add(type); t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'), 2600); }
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function nowLabel(ts){ const d=new Date(ts); const t=new Date(); const sameDay=d.toDateString()===t.toDateString();
  return sameDay? `今日 ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`
               : `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function dateLabel(ts){ const d=new Date(ts); return `${d.getMonth()+1}/${d.getDate()}`; }

/* ============================================================
   起動
   ============================================================ */
renderLoginFields();
</script>
